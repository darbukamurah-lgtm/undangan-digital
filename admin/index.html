<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Undangan</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
body{
  font-family:'Poppins', sans-serif;
  background:#f5f7f8;
  margin:0;
}

/* HEADER ATAS */
.top-header{
  text-align:center;
  padding:30px 20px 10px;
}

.top-header h1{
  margin:0;
  font-size:18px;
  color:#333;
}

.brand{
  font-family:'Great Vibes', cursive;
  font-size:32px;
  color:#1F4E57;
  margin-top:5px;
}

/* WRAPPER */
.wrapper{
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* FORM & LOGIN BOX */
.center-area{
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.admin-box, .login-box {
  background:#fff;
  padding:25px;
  border-radius:20px;
  width:100%;
  max-width:400px;
  box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

h2{
  text-align:center;
  margin-bottom:20px;
}

input{
  width:100%;
  padding:12px;
  margin-bottom:12px;
  border-radius:10px;
  border:1px solid #ddd;
  box-sizing: border-box;
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#1F4E57;
  color:#fff;
  cursor:pointer;
  font-weight: 600;
}

/* KONDISI TAMPILAN (Sembunyikan default) */
#auth-area, #main-content {
  display: none;
}

/* LOGOUT AREA */
.logout-container {
  max-width: 400px;
  margin: 0 auto;
  padding: 0 20px;
  text-align: right;
}
.btn-logout {
  background: #c0392b;
  padding: 8px 15px;
  width: auto;
  font-size: 13px;
  border-radius: 8px;
}

/* LIST */
.list{
  padding:20px;
  max-width: 440px;
  margin: 0 auto;
}

/* CARD */
.card{
  background:#fff;
  padding:15px;
  border-radius:15px;
  margin-bottom:10px;
  box-shadow:0 5px 15px rgba(0,0,0,0.08);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.nama{ font-weight:600; }
.nomor{ font-size:12px; color:#777; }

.actions{
  display:flex;
  gap:6px;
}

.btn{
  padding:8px 10px;
  border-radius:10px;
  font-size:12px;
  text-decoration:none;
  color:#fff;
  border:none;
  cursor:pointer;
}

.btn-wa{ background:#25D366; }
.btn-copy{ background:#1F4E57; }

/* BADGE */
.badge{
  display:block;
  font-size:11px;
  color:#27ae60;
  margin-top:4px;
}

/* TOAST */
.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%) translateY(100px);
  background:#333;
  color:#fff;
  padding:10px 16px;
  border-radius:20px;
  font-size:13px;
  opacity:0;
  transition:0.3s;
  z-index: 9999;
}

.toast.show{
  transform:translateX(-50%) translateY(0);
  opacity:1;
}
</style>
</head>

<body>

<div class="top-header">
  <h1>Admin Undangan Digital</h1>
  <div class="brand">Ade & Linda</div>
</div>

<div class="wrapper">

  <div id="auth-area" class="center-area">
    <div class="login-box">
      <h2>Login Admin</h2>
      <input type="email" id="login-email" placeholder="Email Admin">
      <input type="password" id="login-password" placeholder="Password">
      <button onclick="login()">Masuk</button>
    </div>
  </div>

  <div id="main-content">
    
    <div class="logout-container">
      <button class="btn-logout" onclick="logout()">Logout</button>
    </div>

    <div class="center-area">
      <div class="admin-box">
        <h2>Generator Undangan</h2>
        <input type="text" id="nama" placeholder="Nama Tamu">
        <input type="tel" id="nomor" placeholder="Nomor WA (812xxx)" inputmode="numeric">
        <button onclick="tambahTamu()">Generate & Simpan</button>
      </div>
    </div>

    <div class="list">
      <div id="list"></div>
    </div>
    
  </div>

</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>
const db = supabase.createClient(
  "https://bqcpseqeiovzoymsplui.supabase.co",
  "sb_publishable_KQP-GNeECUdrR35MZzLK1A_mJQkrI2y"
);

const list = document.getElementById("list");
const toast = document.getElementById("toast");
const authArea = document.getElementById("auth-area");
const mainContent = document.getElementById("main-content");

function showToast(msg){
  toast.innerText = msg;
  toast.classList.add("show");
  setTimeout(()=>toast.classList.remove("show"),2000);
}

// 1. CEK STATUS LOGIN USER SEKARANG ATAU KETIKA PERUBAHAN AUTH
db.auth.onAuthStateChange((event, session) => {
  if (session) {
    // Jika user terdeteksi sudah login
    authArea.style.display = "none";
    mainContent.style.display = "block";
    loadTamu(); // Load data tamu saat login sukses
  } else {
    // Jika belum login / logout
    authArea.style.display = "flex";
    mainContent.style.display = "none";
    list.innerHTML = ""; // Bersihkan list
  }
});

// 2. FUNGSI LOGIN
async function login() {
  const email = document.getElementById("login-email").value.trim();
  const password = document.getElementById("login-password").value.trim();

  if(!email || !password){
    showToast("Email & Password jangan kosong!");
    return;
  }

  const { data, error } = await db.auth.signInWithPassword({
    email: email,
    password: password,
  });

  if (error) {
    showToast(`Gagal: ${error.message} ❌`);
  } else {
    showToast("Login berhasil! 🎉");
  }
}

// 3. FUNGSI LOGOUT
async function logout() {
  const { error } = await db.auth.signOut();
  if (error) {
    showToast("Gagal logout 😭");
  } else {
    showToast("Berhasil keluar 👋");
  }
}

// --- SISA LOGIK KODE LAMA KAMU ---

async function loadTamu(){
  const { data, error } = await db
    .from('tamu')
    .select('*')
    .order('created_at', { ascending:false });

  if (error) {
    showToast("Gagal load data tamu!");
    return;
  }

  list.innerHTML = "";
  if(data) data.forEach(renderCard);
}

async function tambahTamu(){
  const nama = document.getElementById("nama").value.trim();
  const nomor = document.getElementById("nomor").value.trim();

  if(!nama || !nomor){
    showToast("Isi dulu 😭");
    return;
  }

  const { data, error } = await db
    .from('tamu')
    .insert([{ nama, nomor }])
    .select();

  if(error) {
    showToast("Gagal simpan data!");
    return;
  }

  renderCard(data[0], true);

  document.getElementById("nama").value="";
  document.getElementById("nomor").value="";
}

function renderCard(tamu, isNew=false){
  const div = document.createElement("div");
  div.className = "card";

  let sent = tamu.sent;
  const linkUndangan = `https://ade-linda.vercel.app/?to=${encodeURIComponent(tamu.nama)}`;
  const pesan = `Kepada Yth.\nBapak/Ibu/Sdr/i\n*${tamu.nama}*\n\n_Assalamualaikum Warahmatullahi Wabarakatuh_\n\nDengan memohon rahmat dan ridho-Mu Ya Allah, \nKami bermaksud mengundang anda pada acara pernikahan kami. \n\n*Berikut link undangan kami*, untuk info lengkap dari acara bisa kunjungi :\n\n${linkUndangan}\n\nMerupakan suatu kebahagiaan bagi kami apabila Bapak/Ibu/Saudara/i berkenan untuk hadir dan memberikan doa restu.\n\n*Mohon maaf perihal undangan hanya di bagikan melalui pesan ini.*\n\nTerima kasih banyak atas perhatiannya.\n\n_Wassalamualaikum Warahmatullahi Wabarakatuh_\n\nHormat kami,\n*Ade & Linda*`;
  const linkWA = `https://wa.me/62${tamu.nomor}?text=${encodeURIComponent(pesan)}`;

  div.innerHTML = `
    <div>
      <div class="nama">${tamu.nama}</div>
      <div class="nomor">${tamu.nomor}</div>
      <span class="badge" style="display:${sent ? 'block':'none'};">✔ Sudah dikirim</span>
    </div>
    <div class="actions">
      <a href="${linkWA}" target="_blank" class="btn btn-wa">WA</a>
      <button class="btn btn-copy">Copy</button>
    </div>
  `;

  const btnWA = div.querySelector(".btn-wa");
  const btnCopy = div.querySelector(".btn-copy");
  const badge = div.querySelector(".badge");

  btnWA.addEventListener("click", async ()=>{
    if(sent){
      showToast("Udah pernah dikirim 😏");
      return;
    }

    badge.style.display="block";
    sent=true;

    await db.from('tamu')
      .update({ sent:true })
      .eq('id', tamu.id);
  });

  btnCopy.addEventListener("click", ()=>{
    navigator.clipboard.writeText(pesan);
    showToast("Pesan berhasil disalin ✅");
  });

  if(isNew){
    list.prepend(div);
  } else {
    list.appendChild(div);
  }
}
</script>

</body>
</html>
